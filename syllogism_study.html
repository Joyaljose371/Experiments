    font-size: 26px;

    font-size: 19px;

    font-size: 19px;
    line-height: 1.65;

    border-left: 3px solid var(--accent);

    padding-top: 10px;
    border-top: 1px dashed #B9C7AF;

    gap: 6px;
    margin: 10px 0 4px;

  .conf-btn {
    flex: 1;
    padding: 10px 4px;
    font-family: var(--mono);
    font-size: 13px;
    border: 1.5px solid var(--rule);
    background: var(--card);
    color: var(--ink-soft);
    border-radius: 3px;

    font-size: 10px;
    color: var(--ink-soft);

    font-size: 15px;

function assignGroup() {
  const listForAI = Math.random() < 0.5 ? "A" : "B";
  const aiFirst = Math.random() < 0.5;
  state.group = listForAI; // which list is shown under AI guidance
  state.order = aiFirst ? "AI_first" : "NoAI_first";

  const listA = EXP_ITEMS.filter(i => i.list === "A");
  const listB = EXP_ITEMS.filter(i => i.list === "B");
  const aiItems = shuffle(listForAI === "A" ? listA : listB);
  const noAiItems = shuffle(listForAI === "A" ? listB : listA);

  const aiBlock = { condition: "AI", items: aiItems };
  const noAiBlock = { condition: "NoAI", items: noAiItems };
  state.blocks = aiFirst ? [aiBlock, noAiBlock] : [noAiBlock, aiBlock];
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function scoreAnswer(answer, gold) { return answer === gold ? 1 : 0; }

function classifyRevision(initial, final, gold) {
  if (initial === final) return "none";
  const wasCorrect = initial === gold;
  const isCorrect = final === gold;
  if (!wasCorrect && isCorrect) return "beneficial";
  if (wasCorrect && !isCorrect) return "harmful";
  return "lateral";
}

  if (state.screen === "practiceDone") return renderPracticeDone();
  if (state.screen === "blockIntro") return renderBlockIntro();
  if (state.screen === "trial") return renderTrial();
  if (state.screen === "done") return renderDone();
}

    <p>Your anonymous participant code: <strong>${state.participant.code}</strong></p>
    <label for="age">Age</label>
    <input type="number" id="age" min="18" max="100" placeholder="e.g. 24">
    <label for="education">Highest level of education</label>
    <select id="education">
      <option value="">Select one</option>
      <option>High school</option>
      <option>Undergraduate</option>
      <option>Postgraduate</option>
      <option>Other</option>
    </select>
    <label for="english">Comfort reading English (1 = not comfortable, 5 = fully fluent)</label>
    <select id="english">
      <option value="">Select one</option>
      <option value="1">1</option><option value="2">2</option><option value="3">3</option>
      <option value="4">4</option><option value="5">5</option>
    </select>
    <label for="aiuse">How often do you currently use AI tools (e.g. ChatGPT)?</label>
    <select id="aiuse">
      <option value="">Select one</option>
      <option>Never</option><option>Rarely</option><option>Sometimes</option>
      <option>Often</option><option>Daily</option>
    </select>
    <button class="primary-btn" id="infoBtn">Continue</button>
  `;
  document.getElementById("infoBtn").addEventListener("click", () => {
    state.participant.age = document.getElementById("age").value;
    state.participant.education = document.getElementById("education").value;
    state.participant.englishComfort = document.getElementById("english").value;
    state.participant.aiUse = document.getElementById("aiuse").value;
    state.screen = "instructions";
    render();
  });
}

function renderInstructions() {
  phaseLabel.textContent = "Instructions";
  app.innerHTML = `
    <h1>How this works</h1>
    <p>On each trial you'll see two statements (the premises) and a possible conclusion. Decide whether the conclusion:</p>
    <ul>
      <li><strong>Entailment</strong> — it must be true, given the premises.</li>
      <li><strong>Contradiction</strong> — it must be false, given the premises.</li>
      <li><strong>Neutral</strong> — it isn't determined either way by the premises.</li>
    </ul>
    <div class="syllogism">
      <span class="prem">All B are C. All A are B.</span>
      <span class="concl">→ All A are C.</span>
    </div>
    <p>Here the conclusion must be true, so the correct answer is <strong>Entailment</strong>.</p>
    <hr class="rule">
    <p>After each answer, you'll also rate how confident you are, from 1 (very unsure) to 6 (very sure).</p>
    <p>On some trials, after your first answer you'll see a short hint, then get a chance to reconsider and give a final answer. On other trials there is no hint — your first answer is final.</p>
    <p>You'll start with 4 practice trials.</p>
    <button class="primary-btn" id="startPracticeBtn">Start practice</button>
  `;
  document.getElementById("startPracticeBtn").addEventListener("click", () => {
    state.screen = "practice";
    state.practiceTrial = { phase: "initial", answer: null, confidence: null };
    state.trialStartTime = Date.now();
    render();
  });
}

function renderChoiceButtons(selected, onPick) {
  const opts = ["entailment", "contradiction", "neutral"];
  const labels = { entailment: "Entailment", contradiction: "Contradiction", neutral: "Neutral" };
  const div = document.createElement("div");
  div.className = "choices";
  opts.forEach(o => {
    const b = document.createElement("button");
    b.className = "choice-btn" + (selected === o ? " selected" : "");
    b.textContent = labels[o];
    b.addEventListener("click", () => onPick(o));
    div.appendChild(b);
  });
  return div;
}

function renderConfidenceRow(selected, onPick) {
  const wrap = document.createElement("div");
  wrap.innerHTML = `<div class="conf-labels"><span>Very unsure</span><span>Very sure</span></div>`;
  const row = document.createElement("div");
  row.className = "confidence-row";
  for (let i = 1; i <= 6; i++) {
    const b = document.createElement("button");
    b.className = "conf-btn" + (selected === i ? " selected" : "");
    b.textContent = i;
    b.addEventListener("click", () => onPick(i));
    row.appendChild(b);
  }
  wrap.appendChild(row);
  return wrap;
}

function renderSyllogism(item) {
  const div = document.createElement("div");
  div.className = "syllogism";
  div.innerHTML = `<span class="prem">${item.premises_en}</span><span class="concl">→ ${item.hypothesis_en}</span>`;
  return div;
}

function renderPractice() {
  phaseLabel.textContent = `Practice ${state.practiceIndex + 1} / ${PRACTICE_ITEMS.length}`;
  const item = PRACTICE_ITEMS[state.practiceIndex];
  app.innerHTML = "";

  const flag = document.createElement("div");
  flag.className = "practice-flag";
  flag.textContent = "Practice — not scored";
  app.appendChild(flag);

  const h = document.createElement("h2");
  h.textContent = "Does the conclusion follow?";
  app.appendChild(h);

  app.appendChild(renderSyllogism(item));

  const choices = renderChoiceButtons(state.practiceTrial.answer, (val) => {
    state.practiceTrial.answer = val;
    render();
  });
  app.appendChild(choices);

  const confLabel = document.createElement("label");
  confLabel.textContent = "How confident are you?";
  app.appendChild(confLabel);
  app.appendChild(renderConfidenceRow(state.practiceTrial.confidence, (val) => {
    state.practiceTrial.confidence = val;
    render();
  }));

  const btn = document.createElement("button");
  btn.className = "primary-btn";
  btn.textContent = state.practiceIndex < PRACTICE_ITEMS.length - 1 ? "Next" : "Finish practice";
  btn.disabled = !(state.practiceTrial.answer && state.practiceTrial.confidence);
  btn.addEventListener("click", () => {
    state.practiceIndex++;
    if (state.practiceIndex >= PRACTICE_ITEMS.length) {
      state.screen = "practiceDone";
    } else {
      state.practiceTrial = { phase: "initial", answer: null, confidence: null };
    }
    render();
  });
  app.appendChild(btn);
}

function renderPracticeDone() {
  phaseLabel.textContent = "Practice complete";
  app.innerHTML = `
    <h1>Practice complete</h1>
    <p>Now the main task begins: ${EXP_ITEMS.length} trials, in two parts. In one part you'll get a hint and a chance to reconsider; in the other you won't.</p>
    <p>Please try to work through this in one sitting.</p>
    <button class="primary-btn" id="beginMainBtn">Begin</button>
  `;
  document.getElementById("beginMainBtn").addEventListener("click", () => {
    assignGroup();
    state.blockIndex = 0;
    state.trialIndex = 0;
    state.screen = "blockIntro";
    render();
  });
}

function renderBlockIntro() {
  const block = state.blocks[state.blockIndex];
  phaseLabel.textContent = `Part ${state.blockIndex + 1} of 2`;
  const withHint = block.condition === "AI";
  app.innerHTML = `
    <h1>Part ${state.blockIndex + 1}</h1>
    <p>${withHint
      ? "In this part, after your first answer you will see a short hint, then be asked to reconsider before giving a final answer."
      : "In this part, you will give one answer per problem — there is no hint or reconsideration stage."}</p>
    <p>${block.items.length} problems in this part.</p>
    <button class="primary-btn" id="startBlockBtn">Start</button>
  `;
  document.getElementById("startBlockBtn").addEventListener("click", () => {
    state.trialPhase = "initial";
    state.currentTrialData = {};
    state.trialStartTime = Date.now();
    state.screen = "trial";
    render();
  });
}

function renderTrial() {
  const block = state.blocks[state.blockIndex];
  const item = block.items[state.trialIndex];
  const isAI = block.condition === "AI";
  const totalTrials = EXP_ITEMS.length;
  const completedSoFar = state.blockIndex * (EXP_ITEMS.length / 2) + state.trialIndex;

  phaseLabel.textContent = `Trial ${completedSoFar + 1} / ${totalTrials}`;

  app.innerHTML = "";

  const bar = document.createElement("div");
  bar.className = "progress-track";
  bar.innerHTML = `<div class="progress-fill" style="width:${(completedSoFar / totalTrials) * 100}%"></div>`;
  app.appendChild(bar);

  const h = document.createElement("h2");
  h.textContent = state.trialPhase === "final" ? "Your final answer" : "Does the conclusion follow?";
  app.appendChild(h);

  app.appendChild(renderSyllogism(item));

  if (state.trialPhase === "guidance") {
    const g = document.createElement("div");
    g.className = "guidance";
    g.innerHTML = `<span class="tag">Hint</span>${GUIDANCE_TEXT}`;
    app.appendChild(g);

    const btn = document.createElement("button");
    btn.className = "primary-btn";
    btn.textContent = "Reconsider and answer";
    btn.addEventListener("click", () => {
      state.trialPhase = "final";
      state.trialStartTime = Date.now();
      render();
    });
    app.appendChild(btn);
    return;
  }

  const answerKey = state.trialPhase === "final" ? "finalAnswer" : "initialAnswer";
  const confKey = state.trialPhase === "final" ? "finalConfidence" : "initialConfidence";

  const choices = renderChoiceButtons(state.currentTrialData[answerKey], (val) => {
    state.currentTrialData[answerKey] = val;
    render();
  });
  app.appendChild(choices);

  const confLabel = document.createElement("label");
  confLabel.textContent = "How confident are you?";
  app.appendChild(confLabel);
  app.appendChild(renderConfidenceRow(state.currentTrialData[confKey], (val) => {
    state.currentTrialData[confKey] = val;
    render();
  }));

  const ready = state.currentTrialData[answerKey] && state.currentTrialData[confKey];
  const btn = document.createElement("button");
  btn.className = "primary-btn";
  btn.disabled = !ready;

  if (state.trialPhase === "initial") {
    btn.textContent = isAI ? "Continue" : "Next";
    btn.addEventListener("click", () => {
      state.currentTrialData.initialRT = Date.now() - state.trialStartTime;
      if (isAI) {
        state.trialPhase = "guidance";
      } else {
        state.currentTrialData.finalAnswer = state.currentTrialData.initialAnswer;
        state.currentTrialData.finalConfidence = state.currentTrialData.initialConfidence;
        state.currentTrialData.finalRT = null;
        finishTrial(item, block);
        return;
      }
      render();
    });
  } else {
    btn.textContent = "Next";
    btn.addEventListener("click", () => {
      state.currentTrialData.finalRT = Date.now() - state.trialStartTime;
      finishTrial(item, block);
    });
  }
  app.appendChild(btn);
}

function finishTrial(item, block) {
  const d = state.currentTrialData;
  const gold = item.gold;
  const accInitial = scoreAnswer(d.initialAnswer, gold);
  const accFinal = scoreAnswer(d.finalAnswer, gold);
  const changed = d.initialAnswer !== d.finalAnswer;
  const revisionType = block.condition === "AI" ? classifyRevision(d.initialAnswer, d.finalAnswer, gold) : "n/a_no_ai";

  state.results.push({
    participant_code: state.participant.code,
    age: state.participant.age,
    education: state.participant.education,
    english_comfort: state.participant.englishComfort,
    ai_use_frequency: state.participant.aiUse,
    group_ai_list: state.group,
    block_order: state.order,
    is_practice: 0,
    item_id: item.ID,
    gold_label: gold,
    content_type: item["content-type"],
    conversion_item: item.conversion || "no",
    atmosphere_item: item.atmosphere || "no",
    condition: block.condition,
    block_position: state.blockIndex + 1,
    trial_index_in_block: state.trialIndex + 1,
    initial_answer: d.initialAnswer,
    initial_confidence: d.initialConfidence,
    initial_rt_ms: d.initialRT,
    guidance_shown: block.condition === "AI" ? 1 : 0,
    final_answer: d.finalAnswer,
    final_confidence: d.finalConfidence,
    final_rt_ms: d.finalRT,
    accuracy_initial: accInitial,
    accuracy_final: accFinal,
    answer_changed: changed ? 1 : 0,
    revision_type: revisionType
  });

  state.trialIndex++;
  if (state.trialIndex >= block.items.length) {
    state.blockIndex++;
    state.trialIndex = 0;
    if (state.blockIndex >= state.blocks.length) {
      state.screen = "done";
    } else {
      state.screen = "blockIntro";
    }
  } else {
    state.trialPhase = "initial";
    state.currentTrialData = {};
    state.trialStartTime = Date.now();
    state.screen = "trial";
  }
  render();
}

function renderDone() {
  phaseLabel.textContent = "Complete";
  const rows = state.results;
  const n = rows.length;
  const accByCondition = { AI: [], NoAI: [] };
  const confByCondition = { AI: [], NoAI: [] };
  rows.forEach(r => {
    accByCondition[r.condition].push(r.accuracy_final);
    confByCondition[r.condition].push(r.final_confidence);
  });
  const mean = arr => arr.length ? (arr.reduce((a, b) => a + b, 0) / arr.length) : 0;
  const accAI = (mean(accByCondition.AI) * 100).toFixed(0);
  const accNoAI = (mean(accByCondition.NoAI) * 100).toFixed(0);
  const confAI = mean(confByCondition.AI).toFixed(1);
  const confNoAI = mean(confByCondition.NoAI).toFixed(1);

  app.innerHTML = `
    <h1>Thank you</h1>
    <p>You've completed the study. Here's a quick summary of your own results — this is just for you, not a judgment of performance.</p>
    <div class="summary-grid">
      <div class="summary-box"><div class="num">${accNoAI}%</div><div class="lab">Accuracy — No hint</div></div>
      <div class="summary-box"><div class="num">${accAI}%</div><div class="lab">Accuracy — With hint</div></div>
      <div class="summary-box"><div class="num">${confNoAI}</div><div class="lab">Confidence — No hint</div></div>
      <div class="summary-box"><div class="num">${confAI}</div><div class="lab">Confidence — With hint</div></div>
    </div>
    <hr class="rule">
    <p><strong>Debrief:</strong> the "hint" shown in this study was a fixed, standardized piece of text — not a live AI system, and it never revealed the correct answer directly. It was designed this way to keep the assistance identical for everyone taking part.</p>
    <button class="primary-btn" id="downloadBtn">Download results (CSV)</button>
    <p class="note">Your data (${n} trial rows) is only in this browser tab. Downloading is the only way to keep it.</p>
  `;
  document.getElementById("downloadBtn").addEventListener("click", downloadCSV);
}

function downloadCSV() {
  const rows = state.results;
  if (!rows.length) return;
  const headers = Object.keys(rows[0]);
  const lines = [headers.join(",")];
  rows.forEach(r => {
    lines.push(headers.map(h => {
      const v = r[h] === null || r[h] === undefined ? "" : r[h];
      const s = String(v).replace(/"/g, '""');
      return /[,"\n]/.test(s) ? `"${s}"` : s;
    }).join(","));
  });
  const csv = lines.join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `syllogism_study_${state.participant.code}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

render();
</script>
</body>
</html>
